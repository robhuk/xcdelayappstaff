<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Delay / OT Report</title>
<style>
  :root {
    --navy:#9b1c1f;
    --blue:#c72a2e;
    --orange:#d6a62a;
    --light:#f7f4ed;
    --border:#d8cdb8;
    --text:#241f1b;
    --muted:#6b6258;
    --danger:#8f171a;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:24px;
    background:var(--light);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
  }
  .container { max-width:760px; margin:auto; }
  .card {
    background:#fff; border:1px solid var(--border); border-radius:12px;
    box-shadow:0 5px 18px rgba(0,0,0,.07); overflow:hidden;
  }
  header { background:linear-gradient(135deg,var(--navy),var(--blue)); color:#fff; padding:22px 26px; }
  h1 { margin:0; font-size:25px; }
  header p { margin:6px 0 0; opacity:.9; font-size:14px; }
  form { padding:24px 26px 26px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .full { grid-column:1 / -1; }
  label { display:block; font-weight:700; font-size:14px; margin-bottom:7px; }
  input, select, textarea {
    width:100%; padding:11px 12px; border:1px solid var(--border);
    border-radius:7px; font:inherit; background:#fff; color:var(--text);
  }
  input:focus, select:focus, textarea:focus {
    outline:2px solid rgba(29,95,138,.18); border-color:var(--orange);
  }
  .hint { color:var(--muted); font-size:12px; margin-top:5px; }
  .error { color:var(--danger); font-size:12px; margin-top:5px; min-height:15px; }
  .other-wrap { display:none; margin-top:12px; }
  .result {
    margin-top:20px; padding:15px; background:#f8f2fb; border:1px solid #d9c8e5;
    border-radius:8px; display:none;
  }
  .result strong { display:block; margin-bottom:5px; }
  .buttons { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
  button {
    border:0; border-radius:7px; padding:12px 17px; font-weight:700;
    cursor:pointer; font-size:14px;
  }
  .primary { background:linear-gradient(135deg,var(--navy),var(--blue)); color:#fff; }
  .secondary { background:var(--navy); color:#fff; }
  .reset { background:#fff; color:var(--muted); border:1px solid var(--border); }
  button:hover { filter:brightness(.96); }
  button:active { transform:translateY(1px); }
  @media (hover:none) {
    button:hover { filter:none; }
  }
  @media (max-width:600px) {
    body {
      padding:0;
      background:#fff;
      font-size:16px;
    }
    .container {
      width:100%;
      max-width:none;
      margin:0;
    }
    .card {
      min-height:100vh;
      border:0;
      border-top:4px solid var(--orange);
      border-radius:0;
      box-shadow:none;
    }
    header {
      padding:20px 18px;
    }
    h1 {
      font-size:23px;
      line-height:1.15;
    }
    header p {
      font-size:13px;
      line-height:1.4;
    }
    form {
      padding:18px 16px 28px;
    }
    .grid {
      display:block;
    }
    .grid > div {
      margin-bottom:17px;
    }
    .full {
      width:100%;
    }
    label {
      font-size:15px;
      margin-bottom:8px;
    }
    input, select, textarea {
      min-height:48px;
      font-size:16px;
      padding:12px;
      border-radius:8px;
    }
    select {
      padding-right:36px;
    }
    .hint {
      font-size:12px;
      line-height:1.4;
    }
    .buttons {
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:20px;
    }
    button {
      width:100%;
      min-height:50px;
      font-size:16px;
      padding:13px 16px;
    }
    .result {
      margin-top:8px;
      padding:14px;
      font-size:16px;
    }
  }
.card { border-top:4px solid var(--orange); }\n</style>
</head>
<body>
<div class="container">
  <div class="card">
    <header>
      <h1>Staff Delay / OT Report</h1>
      <p>To be used when 12 hour rule is not broken, if less than 12 hours rest contact TCC</p>
    </header>

    <form id="delayForm" novalidate>
      <div class="grid">
        <div>
          <label for="date">Date</label>
          <input id="date" type="date" required>
        </div>

        <div>
          <label for="headcode">Headcode</label>
          <input id="headcode" type="text" maxlength="4" placeholder="1A23"
                 autocomplete="off" required pattern="[0-9][A-Za-z][0-9]{2}">
          <div class="hint">Exactly 4 characters: number, letter, number, number (e.g. 1E63).</div>
          <div class="error" id="headcodeError"></div>
        </div>

        <div>
          <label for="delay">Delay in Minutes</label>
          <input id="delay" type="number" min="1" step="1" placeholder="15" required>
        </div>

        <div>
          <label for="bookoff">Original Book Off Time</label>
          <input id="bookoff" type="time" required>
        </div>

        <div class="full">
          <label for="reason">Reason for Delay</label>
          <select id="reason" required>
            <option value="">— Select delay reason —</option>
            <optgroup label="Infrastructure / Track">
              <option>Points failure</option>
              <option>Points defect / points problem</option>
              <option>Track circuit failure</option>
              <option>Track defect / broken rail</option>
              <option>Signalling failure</option>
              <option>Signalling equipment fault</option>
              <option>Signal passed at danger / SPAD incident</option>
              <option>Level crossing failure</option>
              <option>Level crossing obstruction / misuse</option>
              <option>Overhead line equipment (OLE) fault</option>
              <option>Third rail / conductor rail fault</option>
              <option>Electrical supply failure</option>
              <option>Power failure</option>
              <option>Telecommunications / GSM-R failure</option>
              <option>Infrastructure equipment failure</option>
              <option>Engineering works / possession overrunning</option>
              <option>Engineering train / engineering activity</option>
              <option>Flooding / water on line</option>
              <option>Weather-related infrastructure damage</option>
              <option>Bridge / tunnel / structure incident</option>
              <option>Vegetation / fallen tree</option>
              <option>Animal on or near the line</option>
              <option>Debris / obstruction on the line</option>
            </optgroup>
            <optgroup label="Train / Rolling Stock">
              <option>Train fault</option>
              <option>Door fault</option>
              <option>Door obstruction / passenger trapped in doors</option>
              <option>Brake fault</option>
              <option>Traction / engine fault</option>
              <option>Electrical fault</option>
              <option>Cab equipment fault</option>
              <option>On-board systems / IT fault</option>
              <option>Safety equipment fault</option>
              <option>Wheel / axle defect</option>
              <option>Coupling / uncoupling problem</option>
              <option>Train preparation / servicing issue</option>
              <option>Train damaged</option>
              <option>Train operating with reduced capability</option>
              <option>Train length / formation issue</option>
              <option>Short-formed / cancelled vehicle</option>
              <option>Train evacuation / detraining</option>
            </optgroup>
            <optgroup label="Crew / Operational">
              <option>Crew availability</option>
              <option>Crew late on duty</option>
              <option>Train crew change</option>
              <option>Late inbound Train Manager</option>
              <option>Late inbound Driver</option>
              <option>Driver / Train Manager handover</option>
              <option>Relief crew unavailable</option>
              <option>Diagram / rostering issue</option>
              <option>Operational / dispatch delay</option>
              <option>Dispatch procedure / platform dispatch issue</option>
              <option>Train preparation delay</option>
              <option>Depot / sidings movement delay</option>
              <option>Train despatch equipment failure</option>
              <option>Route knowledge / operational issue</option>
            </optgroup>
            <optgroup label="Passenger / Station">
              <option>Passenger illness / medical emergency</option>
              <option>Passenger accident / injury</option>
              <option>Passenger disturbance</option>
              <option>Passenger assistance / PRM assistance</option>
              <option>Passenger loading / alighting</option>
              <option>Passenger overcrowding</option>
              <option>Passenger doors held open</option>
              <option>Person on platform / restricted area</option>
              <option>Station staff / dispatch issue</option>
              <option>Station equipment failure</option>
              <option>Lift / escalator failure affecting operation</option>
              <option>Lost property / security check</option>
              <option>Police attendance</option>
              <option>Emergency services attendance</option>
            </optgroup>
            <optgroup label="External / Network">
              <option>Person on the line</option>
              <option>Person struck by train / fatality</option>
              <option>Suicide / suspected suicide incident</option>
              <option>Trespass</option>
              <option>Crime / security incident</option>
              <option>Police incident</option>
              <option>Road traffic accident affecting railway</option>
              <option>Vehicle on or near railway</option>
              <option>Fire / smoke</option>
              <option>Bomb threat / suspicious item</option>
              <option>Security alert</option>
              <option>Obstruction outside railway control</option>
              <option>Other operator / connecting service delay</option>
              <option>Congestion / service regulation</option>
              <option>Late-running preceding service</option>
              <option>Platforming / platform availability</option>
              <option>Network disruption / disruption elsewhere</option>
            </optgroup>
            <optgroup label="Weather / Environmental">
              <option>Severe weather</option>
              <option>High winds</option>
              <option>Heavy rain</option>
              <option>Snow / ice</option>
              <option>Extreme heat</option>
              <option>Lightning</option>
              <option>Low visibility / fog</option>
              <option>Flooding</option>
              <option>Leaves on the line / low rail adhesion</option>
              <option>Autumn conditions / poor rail adhesion</option>
            </optgroup>
            <optgroup label="Control / Timetable">
              <option>Signaller regulation</option>
              <option>Signaller / control room instruction</option>
              <option>Train regulation / precedence</option>
              <option>Pathing / timetable conflict</option>
              <option>Late departure from origin</option>
              <option>Late arrival from previous working</option>
              <option>Waiting for connecting passengers</option>
              <option>Waiting for connecting train</option>
              <option>Waiting for a portion of this train to attach/detach</option>
              <option>Timetable / planning issue</option>
              <option>Operational incident</option>
            </optgroup>
            <optgroup label="Other">
              <option>OTHER</option>
            </optgroup>
          </select>

          <div class="other-wrap" id="otherWrap">
            <label for="otherReason">Other reason</label>
            <textarea id="otherReason" rows="3" placeholder="Enter the reason for the delay..."></textarea>
          </div>
        </div>
      </div>

      <div class="result" id="result">
        <strong>New book off time</strong>
        <span id="newBookOff"></span>
      </div>

      <div class="buttons">
        <button type="button" class="primary" id="emailBtn">✉ Generate Email</button>
        <button type="button" class="secondary" id="copyBtn">📋 Copy to Clipboard</button>
        <button type="reset" class="reset" id="resetBtn">Reset</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  const dateEl = document.getElementById('date');
  const headcodeEl = document.getElementById('headcode');
  const delayEl = document.getElementById('delay');
  const reasonEl = document.getElementById('reason');
  const otherWrap = document.getElementById('otherWrap');
  const otherReasonEl = document.getElementById('otherReason');
  const bookoffEl = document.getElementById('bookoff');
  const resultEl = document.getElementById('result');
  const newBookOffEl = document.getElementById('newBookOff');
  const headcodeError = document.getElementById('headcodeError');

  function localISODate() {
    const d = new Date();
    const offset = d.getTimezoneOffset();
    return new Date(d.getTime() - offset * 60000).toISOString().slice(0,10);
  }

  dateEl.value = localISODate();

  headcodeEl.addEventListener('input', () => {
    headcodeEl.value = headcodeEl.value.toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0,4);
    validateHeadcode();
  });

  function validateHeadcode() {
    const ok = /^[0-9][A-Z][0-9]{2}$/.test(headcodeEl.value);
    headcodeError.textContent = headcodeEl.value && !ok
      ? 'Headcode must be number-letter-number-number, e.g. 1A23.'
      : '';
    return ok;
  }

  reasonEl.addEventListener('change', () => {
    const isOther = reasonEl.value === 'OTHER';
    otherWrap.style.display = isOther ? 'block' : 'none';
    otherReasonEl.required = isOther;
    if (!isOther) otherReasonEl.value = '';
  });

  function formatDate(value) {
    const [y,m,d] = value.split('-');
    return `${d}/${m}/${y}`;
  }

  function calculateNewBookOff() {
    if (!bookoffEl.value || !delayEl.value) return '';
    const [h,m] = bookoffEl.value.split(':').map(Number);
    const mins = Number(delayEl.value);
    const total = h * 60 + m + mins;
    const dayMins = 24 * 60;
    const wrapped = ((total % dayMins) + dayMins) % dayMins;
    const nh = Math.floor(wrapped / 60);
    const nm = wrapped % 60;
    return `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
  }

  function getData() {
    const headcodeOK = validateHeadcode();
    if (!dateEl.value || !headcodeOK || !delayEl.value ||
        Number(delayEl.value) < 1 || !reasonEl.value || !bookoffEl.value) {
      alert('Please complete all required fields. Check the headcode format.');
      return null;
    }

    let reason = reasonEl.value;
    if (reason === 'OTHER') {
      reason = otherReasonEl.value.trim();
      if (!reason) {
        alert('Please enter the other delay reason.');
        otherReasonEl.focus();
        return null;
      }
    }

    const newTime = calculateNewBookOff();
    resultEl.style.display = 'block';
    newBookOffEl.textContent = newTime;

    return {
      date: dateEl.value,
      dateDisplay: formatDate(dateEl.value),
      headcode: headcodeEl.value,
      delay: Number(delayEl.value),
      reason,
      originalBookOff: bookoffEl.value,
      newBookOff: newTime
    };
  }

  function emailContent(data) {
    const subject = `Crew Delay Email for ${data.headcode} on ${data.dateDisplay}`;
    const body =
`Hello due to a delay on ${data.headcode} Please book me off late today. My train was late due to ${data.reason}.
My new book off time is ${data.newBookOff}

Thanks`;
    return { subject, body };
  }

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const data = getData();
    if (!data) return;
    const email = emailContent(data);
    const text = `Subject: ${email.subject}\n\n${email.body}`;

    try {
      await navigator.clipboard.writeText(text);
      alert('Email subject and body copied to the clipboard.');
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      alert('Email subject and body copied to the clipboard.');
    }
  });

  document.getElementById('emailBtn').addEventListener('click', () => {
    const data = getData();
    if (!data) return;
    const email = emailContent(data);
    const mailto =
      `mailto:?subject=${encodeURIComponent(email.subject)}&body=${encodeURIComponent(email.body)}`;
    window.location.href = mailto;
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    setTimeout(() => {
      dateEl.value = localISODate();
      otherWrap.style.display = 'none';
      otherReasonEl.required = false;
      headcodeError.textContent = '';
      resultEl.style.display = 'none';
    }, 0);
  });
})();
</script>
</body>
</html>
